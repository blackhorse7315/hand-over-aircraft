<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecrew-Hand Over Cabin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tambahkan library html2pdf untuk fitur cetak PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: white; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .tab-content { display: none; }
        .tab-active { display: block; }
        
        /* Ubah style nav-active menjadi bentuk tombol (pill) agar lebih ramah sentuhan di HP */
        .nav-active { background: rgba(96, 165, 250, 0.2); color: #60a5fa; font-weight: 500; }
        
        /* CSS untuk menyembunyikan scrollbar tapi tetap bisa di-scroll (Khas iOS) */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input, select { background: rgba(0,0,0,0.2) !important; color: white !important; border: 1px solid rgba(255,255,255,0.1) !important; }
        input::placeholder { color: #94a3b8; }
        table { border-collapse: separate; border-spacing: 0 10px; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8" onload="initApp()">

    <header class="max-w-5xl mx-auto mb-8 flex justify-between items-center">
        <h1 class="text-2xl font-light tracking-widest">ECREW HANDOVER</h1>
        <div class="flex items-center gap-4">
            <span id="statusMsg" class="text-xs text-gray-400"></span>
            <button id="syncBtn" onclick="syncData()" class="p-2 glass rounded-full hover:bg-white/20 transition">
                <svg id="syncIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>
    </header>

    <nav class="max-w-5xl mx-auto glass rounded-2xl mb-8">
        <!-- Ubah ul menjadi flex nowrap dengan overflow auto agar bisa di-swipe di HP -->
        <ul class="flex overflow-x-auto hide-scrollbar gap-2 text-sm p-2 whitespace-nowrap md:justify-center">
            <li class="cursor-pointer hover:bg-white/10 nav-item nav-active px-4 py-2 rounded-xl transition flex-shrink-0" onclick="showTab('list', this)">Data Handover</li>
            <li class="cursor-pointer hover:bg-white/10 nav-item px-4 py-2 rounded-xl transition flex-shrink-0" onclick="showTab('add', this)">Add New Report</li>
            <li class="cursor-pointer hover:bg-white/10 nav-item px-4 py-2 rounded-xl transition flex-shrink-0" onclick="showTab('cabin', this)">DB Cabin</li>
            <li class="cursor-pointer hover:bg-white/10 nav-item px-4 py-2 rounded-xl transition flex-shrink-0" onclick="showTab('engineer', this)">DB Engineer</li>
            <li class="cursor-pointer hover:bg-white/10 nav-item px-4 py-2 rounded-xl transition flex-shrink-0" onclick="showTab('aircraft', this)">DB Aircraft</li>
        </ul>
    </nav>

    <main class="max-w-5xl mx-auto glass rounded-3xl p-8">
        <!-- Tab Data Handover -->
        <div id="list" class="tab-content tab-active">
            <h2 class="text-xl font-medium mb-6">Daftar Laporan Terkini</h2>
            <div id="handoverList" class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead><tr class="text-gray-400 border-b border-white/10"><th>Date</th><th>Route</th><th>Reg</th><th>Handover By</th><th>Received By</th></tr></thead>
                    <tbody id="handoverTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab Add New Report -->
        <div id="add" class="tab-content">
            <h2 id="formTitle" class="text-xl font-medium mb-6">Tambah Laporan Baru</h2>
            <form id="reportForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="datetime-local" id="repDate" class="w-full p-3 rounded-xl">
                <select id="repType" class="w-full p-3 rounded-xl">
                    <option value="Flight Out">Flight Out</option>
                    <option value="Flight Return">Flight Return</option>
                </select>
                <input type="text" id="repRoute" placeholder="Route" class="w-full p-3 rounded-xl">
                <select id="repReg" class="w-full p-3 rounded-xl"><option value="">Pilih Registrasi Pesawat</option></select>
                <select id="handoverBy" class="w-full p-3 rounded-xl"><option value="">Handover By</option></select>
                <select id="receivedBy" class="w-full p-3 rounded-xl"><option value="">Received By</option></select>
                
                <div id="image-reports" class="md:col-span-2 space-y-4 mt-4">
                    <h3 class="text-lg border-b border-white/10 pb-2">Detail Gambar</h3>
                </div>
                
                <button type="button" onclick="addImageField()" class="md:col-span-2 bg-gray-600 hover:bg-gray-500 py-2 rounded-xl transition">+ Tambah Input Gambar</button>
                <button type="button" id="submitBtn" onclick="submitReport()" class="md:col-span-2 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl transition">Submit Report</button>
            </form>
        </div>

        <!-- Tab DB Cabin -->
        <div id="cabin" class="tab-content">
            <h2 class="text-xl font-medium mb-6">Database Cabin Crew</h2>
            <form id="cabinForm" class="space-y-4 mb-8">
                <input type="text" id="cabinName" placeholder="Name" class="w-full p-3 rounded-xl">
                <input type="text" id="cabinUrl" placeholder="Sign URL" class="w-full p-3 rounded-xl">
                <div id="cabinFormButtons" class="flex gap-2">
                    <button type="button" onclick="saveData('cabin')" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl transition">Save</button>
                </div>
            </form>
            <div id="cabinList" class="space-y-2"></div>
        </div>

        <!-- Tab DB Engineer -->
        <div id="engineer" class="tab-content">
            <h2 class="text-xl font-medium mb-6">Database Engineer</h2>
            <form id="engForm" class="space-y-4 mb-8">
                <input type="text" id="engName" placeholder="Name" class="w-full p-3 rounded-xl">
                <input type="text" id="engUrl" placeholder="Sign URL" class="w-full p-3 rounded-xl">
                <div id="engFormButtons" class="flex gap-2">
                    <button type="button" onclick="saveData('eng')" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl transition">Save</button>
                </div>
            </form>
            <div id="engList" class="space-y-2"></div>
        </div>

        <!-- Tab DB Aircraft -->
        <div id="aircraft" class="tab-content">
            <h2 class="text-xl font-medium mb-6">Database Aircraft</h2>
            <form id="airForm" class="space-y-4 mb-8">
                <input type="text" id="airName" placeholder="Registration (e.g. PK-GIA)" class="w-full p-3 rounded-xl">
                <input type="text" id="airType" placeholder="Aircraft Type" class="w-full p-3 rounded-xl">
                <div id="airFormButtons" class="flex gap-2">
                    <button type="button" onclick="saveData('air')" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl transition">Save</button>
                </div>
            </form>
            <div id="airList" class="space-y-2"></div>
        </div>
    </main>

    <!-- Modal Pop-Up Global -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center backdrop-blur-sm p-4 z-50">
        <div class="glass p-8 rounded-3xl w-full max-w-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-300 hover:text-white font-bold text-xl">✕</button>
            <h2 class="text-2xl font-bold mb-6 border-b border-white/20 pb-4" id="modalTitle">Detail Data</h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyCaDSaK8kmnr4c6YaVF8-Zqgi-9DWnqNAYuYDAKZ_Ou2enDdxA-_rOh3i0g0O7OcvV/exec";
        
        // State lokal aplikasi
        let data = { cabin: [], eng: [], air: [], reports: [] };
        let editIdx = { cabin: -1, eng: -1, air: -1, report: -1 };
        let syncTimer = null;
        let isSaving = false; // PENANDA: Mencegah auto-sync menarik data saat sedang proses simpan

        // Inisialisasi Aplikasi & Auto-Sync
        function initApp() {
            syncData(); // Sync pertama kali saat halaman dimuat
            
            // Interval Auto-Sync setiap 15 detik
            syncTimer = setInterval(() => {
                // Jangan lakukan auto-sync jika pengguna SEDANG mengisi laporan atau mengedit sesuatu
                if (!isEditing()) {
                    syncData(true);
                }
            }, 15000);
        }

        // Cek aktivitas pengguna agar inputan/pilihan tidak tertimpa sinkronisasi otomatis
        function isEditing() {
            const sedangEditForm = Object.values(editIdx).some(val => val !== -1);
            const modalTerbuka = !document.getElementById('modal').classList.contains('hidden');
            const lagiDiTabAdd = document.getElementById('add').classList.contains('tab-active'); // Jika di menu tambah laporan
            
            return sedangEditForm || modalTerbuka || isSaving || lagiDiTabAdd; 
        }

        // Tab Navigasi
        function showTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('tab-active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('nav-active'));
            document.getElementById(id).classList.add('tab-active');
            el.classList.add('nav-active');
        }

        // --- Fitur Google Sheet Sync ---
        async function syncData(isBackground = false) {
            const icon = document.getElementById('syncIcon');
            const status = document.getElementById('statusMsg');
            
            icon.classList.add('spin');
            if (!isBackground) status.innerText = "Syncing...";
            
            try {
                const response = await fetch(WEB_APP_URL + "?action=getData");
                if (!response.ok) throw new Error('HTTP error ' + response.status);
                
                const result = await response.json();
                
                if(result.cabin) data.cabin = result.cabin;
                if(result.eng) data.eng = result.eng;
                if(result.air) data.air = result.air;
                if(result.reports) data.reports = result.reports;

                renderAll();
                updateDropdowns();
                
                if (!isBackground) {
                    status.innerText = "Terhubung";
                    status.classList.remove('text-red-400');
                    status.classList.add('text-gray-400');
                }
            } catch (err) {
                // Menggunakan console.warn agar tidak memicu error log merah di sistem
                console.warn("Sinkronisasi gagal (mungkin offline atau URL tidak valid):", err.message);
                
                if (!isBackground) {
                    status.innerText = "Mode Offline (Cek Akses GAS)";
                    status.classList.remove('text-gray-400');
                    status.classList.add('text-red-400');
                    
                    if(err.message.includes("Failed to fetch") || err.message.includes("NetworkError") || err.message.includes("404")) {
                        showGasWarning();
                    }
                }
                renderAll();
                updateDropdowns();
            } finally {
                icon.classList.remove('spin');
                if (!isBackground) {
                    setTimeout(() => { if(status.innerText === "Terhubung") status.innerText = ""; }, 3000);
                }
            }
        }

        async function saveToSheet(sheetName, itemData) {
            isSaving = true; 
            const icon = document.getElementById('syncIcon');
            icon.classList.add('spin'); 
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'save', sheet: sheetName, data: itemData })
                });
                
                await new Promise(resolve => setTimeout(resolve, 2000));
                await syncData(true);
            } catch (err) {
                console.error("Gagal simpan ke sheet:", err);
            } finally {
                icon.classList.remove('spin');
                isSaving = false;
            }
        }

        async function syncUpdateAll(sheetName) {
            isSaving = true; 
            const icon = document.getElementById('syncIcon');
            icon.classList.add('spin'); 
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'updateAll', sheet: sheetName, data: data[sheetName] })
                });
                
                await new Promise(resolve => setTimeout(resolve, 2000));
                await syncData(true);
            } catch (err) {
                console.warn("Gagal update semua data ke sheet:", err);
            } finally {
                icon.classList.remove('spin');
                isSaving = false;
            }
        }

        function showGasWarning() {
            document.getElementById('modalTitle').innerText = "Koneksi Google Sheet Gagal";
            document.getElementById('modalContent').innerHTML = `
                <div class="bg-red-500/20 p-4 rounded-xl border border-red-500/50 text-sm">
                    <p class="font-bold text-red-400 mb-2">Error Akses Data (Misal: 404 atau CORS Blocked).</p>
                    <p class="mb-2">Ini biasanya terjadi karena Link Google Apps Script (WEB_APP_URL) belum diubah ke link Anda sendiri, atau script telah dihapus/diperbarui. Untuk memperbaikinya:</p>
                    <ol class="list-decimal ml-5 space-y-1">
                        <li>Buka Google Script Anda, klik <b>Deploy</b> > <b>New Deployment</b>.</li>
                        <li>Pilih tipe <b>Web App</b>.</li>
                        <li><b>Execute as:</b> Me (Email Anda).</li>
                        <li><b>Who has access:</b> <span class="text-yellow-300 font-bold bg-black/30 px-1 rounded">Anyone</span>.</li>
                        <li>Klik Deploy, lalu salin URL Web App yang baru.</li>
                        <li>Ganti link pada variabel <code class="bg-black/50 px-1 rounded text-yellow-200">WEB_APP_URL</code> di dalam kode HTML ini dengan link milik Anda.</li>
                    </ol>
                </div>
                <div class="mt-6 flex gap-2">
                    <button onclick="closeModal()" class="bg-gray-600 px-6 py-2 rounded-lg font-bold">Mengerti</button>
                </div>
            `;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        // --- Render UI ---
        function renderAll() {
            renderReports();
            renderList('cabin');
            renderList('eng');
            renderList('air');
        }

        function formatTanggal(dateStr) {
            if (!dateStr) return "-";
            const d = new Date(dateStr);
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} / ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        }

        function updateDropdowns() {
            const hSel = document.getElementById('handoverBy');
            const rSel = document.getElementById('receivedBy');
            const aSel = document.getElementById('repReg');
            
            // Simpan nilai lama sebelum dirender ulang agar tidak hilang
            const currentH = hSel.value;
            const currentR = rSel.value;
            const currentA = aSel.value;
            
            [hSel, rSel].forEach(sel => {
                sel.innerHTML = '<option value="">Pilih Nama...</option>';
                data.cabin.forEach(c => sel.innerHTML += `<option value="${c.name} (Cs.)">${c.name} (Cs.)</option>`);
                data.eng.forEach(e => sel.innerHTML += `<option value="${e.name} (Eng.)">${e.name} (Eng.)</option>`);
            });
            
            aSel.innerHTML = '<option value="">Pilih Pesawat...</option>';
            data.air.forEach(a => aSel.innerHTML += `<option value="${a.name}">${a.name}</option>`);
            
            // Pasang kembali nilai lama
            if(currentH) hSel.value = currentH;
            if(currentR) rSel.value = currentR;
            if(currentA) aSel.value = currentA;
        }

        // --- Logika Fitur Laporan (Reports) ---
        const getBase64 = (file) => new Promise((resolve, reject) => {
            if (!file) return resolve('');
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    
                    // KOMPRESI EKSTRA KETAT: Resolusi diturunkan jadi 400px (Aman untuk Google Sheet)
                    const MAX_WIDTH = 400; 
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    } else if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Kualitas JPEG diturunkan menjadi 0.4 (40%) agar ukuran string Base64 pendek
                    resolve(canvas.toDataURL('image/jpeg', 0.4)); 
                };
                img.onerror = (error) => reject(error);
            };
            reader.onerror = (error) => reject(error);
        });

        async function submitReport() {
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const imageEntries = Array.from(document.querySelectorAll('.image-entry'));
            const images = [];

            for (let div of imageEntries) {
                const pos = div.querySelector('input[type="text"]').value;
                const cond = div.querySelectorAll('input[type="text"]')[1].value;
                const fileInput = div.querySelector('input[type="file"]');
                const existingFile = div.querySelector('.existing-file')?.value || '';
                
                let fileData = existingFile; 
                if (fileInput && fileInput.files.length > 0) {
                    fileData = await getBase64(fileInput.files[0]);
                }
                
                images.push({ pos, cond, fileData });
            }

            const r = {
                date: document.getElementById('repDate').value,
                type: document.getElementById('repType').value,
                route: document.getElementById('repRoute').value,
                reg: document.getElementById('repReg').value,
                handover: document.getElementById('handoverBy').value,
                received: document.getElementById('receivedBy').value,
                images: images
            };

            if(editIdx.report >= 0) { 
                data.reports[editIdx.report] = r; 
                editIdx.report = -1; 
                syncUpdateAll('reports');
            } else { 
                data.reports.push(r); 
                saveToSheet('reports', r);
            }
            
            document.getElementById('reportForm').reset();
            const imgContainer = document.getElementById('image-reports');
            imgContainer.innerHTML = '<h3 class="text-lg border-b border-white/10 pb-2">Detail Gambar</h3>';
            
            btn.innerText = "Submit Report";
            btn.disabled = false;
            
            renderReports();
            showTab('list', document.querySelectorAll('.nav-item')[0]);
        }

        function renderReports() {
            document.getElementById('handoverTableBody').innerHTML = data.reports.map((r, i) => `
                <tr class="glass cursor-pointer hover:bg-white/20" onclick="openReportModal(${i})">
                    <td class="p-4">${formatTanggal(r.date)}</td>
                    <td class="p-4">${r.route || '-'}</td>
                    <td class="p-4">${r.reg || '-'}</td>
                    <td class="p-4">${r.handover || '-'}</td>
                    <td class="p-4">${r.received || '-'}</td>
                </tr>
            `).join('');
        }

        function openReportModal(idx) {
            const r = data.reports[idx];
            document.getElementById('modalTitle').innerText = "Detail Laporan";
            let imagesHtml = (r.images && r.images.length > 0) 
                ? r.images.map(img => `
                    <div class="bg-white/5 p-3 rounded-lg text-sm mb-2 border border-white/10">
                        <p><b>Posisi:</b> ${img.pos}</p>
                        <p><b>Kondisi:</b> ${img.cond}</p>
                        ${img.fileData ? `<img src="${img.fileData}" class="mt-2 rounded max-h-40 object-contain w-full bg-black/20">` : ''}
                    </div>
                  `).join('') 
                : 'Tidak ada data gambar';
            
            document.getElementById('modalContent').innerHTML = `
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <p><b class="text-blue-400">Date:</b><br>${formatTanggal(r.date)}</p>
                    <p><b class="text-blue-400">Route:</b><br>${r.route || '-'}</p>
                    <p><b class="text-blue-400">Aircraft:</b><br>${r.reg || '-'}</p>
                    <p><b class="text-blue-400">Type:</b><br>${r.type || '-'}</p>
                    <p><b class="text-blue-400">Handover:</b><br>${r.handover || '-'}</p>
                    <p><b class="text-blue-400">Received:</b><br>${r.received || '-'}</p>
                </div>
                <div class="mt-6"><b class="text-blue-400">Detail Gambar/Kondisi:</b><div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-2">${imagesHtml}</div></div>
                <div class="mt-8 flex flex-wrap gap-2">
                    <button onclick="editReport(${idx})" class="bg-yellow-600 px-6 py-2 rounded-lg font-bold">Edit</button>
                    <button onclick="duplicateReport(${idx})" class="bg-blue-600 px-6 py-2 rounded-lg font-bold">Duplicate</button>
                    <!-- Tambahkan tombol cetak PDF -->
                    <button id="btn-print-${idx}" onclick="downloadPDF(${idx})" class="bg-green-600 hover:bg-green-500 px-6 py-2 rounded-lg font-bold transition">Cetak PDF</button>
                </div>
            `;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        // Fungsi baru untuk menghasilkan dokumen PDF A4 yang rapi dan profesional
        async function downloadPDF(idx) {
            const r = data.reports[idx];
            const btn = document.getElementById(`btn-print-${idx}`);
            const originalText = btn.innerText;
            btn.innerText = "Memproses PDF...";
            btn.disabled = true;

            // Fungsi bantu untuk mengambil URL tanda tangan khusus PDF
            function getSignatureImgUrlForPdf(fullName) {
                if (!fullName || fullName === '-') return '';
                // Hapus embel-embel (Cs.) atau (Eng.) untuk pencarian di database
                let name = fullName.replace(' (Cs.)', '').replace(' (Eng.)', '');
                let db = fullName.includes('(Cs.)') ? data.cabin : (fullName.includes('(Eng.)') ? data.eng : []);
                
                const person = db.find(p => p.name === name);
                if (person && person.url) {
                    const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|docs\.google\.com\/.*?id=)([a-zA-Z0-9_-]+)/;
                    const match = person.url.match(driveRegex);
                    if (match && match[1]) {
                        // KUNCI KECEPATAN: Gunakan Thumbnail API (w400) agar sangat ringan dan cepat diload oleh proxy
                        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w400`;
                    }
                    return person.url;
                }
                return '';
            }

            // Fungsi bantu untuk mem-bypass CORS secara efisien
            async function fetchImageAsBase64(url) {
                if (!url) return '';
                try {
                    // Gunakan allorigins karena paling stabil dan cepat untuk Thumbnail Google Drive
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                    
                    const res = await fetch(proxyUrl);
                    if (!res.ok) throw new Error("Gagal mengambil gambar dari proxy");
                    
                    const blob = await res.blob();
                    return await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(blob);
                    });
                } catch (err) {
                    console.warn("Gambar tanda tangan gagal dimuat untuk PDF:", err);
                    return ''; // Jika gagal, kembalikan kosong agar PDF tetap bisa dicetak
                }
            }

            const handoverSignUrl = getSignatureImgUrlForPdf(r.handover);
            const receivedSignUrl = getSignatureImgUrlForPdf(r.received);

            // KUNCI KECEPATAN: Proses fetch gambar secara BERSAMAAN (Paralel) menggunakan Promise.all
            // Ini akan memangkas waktu loading hingga 50% lebih cepat
            const [handoverB64, receivedB64] = await Promise.all([
                fetchImageAsBase64(handoverSignUrl),
                fetchImageAsBase64(receivedSignUrl)
            ]);

            const handoverSignHtml = handoverB64 
                ? `<img src="${handoverB64}" style="max-height: 80px; max-width: 150px; display: block; margin: 0 auto 10px auto; object-fit: contain;" />` 
                : `<div style="height: 80px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999;">(Tanda tangan tidak tersedia)</div>`;
            
            const receivedSignHtml = receivedB64 
                ? `<img src="${receivedB64}" style="max-height: 80px; max-width: 150px; display: block; margin: 0 auto 10px auto; object-fit: contain;" />` 
                : `<div style="height: 80px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999;">(Tanda tangan tidak tersedia)</div>`;

            // Template khusus cetak PDF (Background putih, teks hitam, format tabel)
            let pdfImagesHtml = '';
            if (r.images && r.images.length > 0) {
                pdfImagesHtml = r.images.map(img => `
                    <div style="page-break-inside: avoid; border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #fafafa;">
                        <p style="margin: 0 0 5px 0;"><strong>Posisi / Fasilitas:</strong> ${img.pos}</p>
                        <p style="margin: 0 0 10px 0;"><strong>Kondisi Ditemukan:</strong> ${img.cond}</p>
                        ${img.fileData ? `<img src="${img.fileData}" style="max-height: 250px; border-radius: 4px; display: block; margin-top: 10px; border: 1px solid #eee;" />` : ''}
                    </div>
                `).join('');
            } else {
                pdfImagesHtml = '<p style="font-style: italic; color: #666;">Tidak ada catatan gambar atau kerusakan terlampir.</p>';
            }

            const printContainer = document.createElement('div');
            printContainer.innerHTML = `
                <div style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; background: #fff; width: 100%;">
                    <h1 style="text-align: center; color: #1e293b; border-bottom: 3px solid #1e293b; padding-bottom: 15px; margin-bottom: 30px; font-size: 24px; letter-spacing: 2px;">
                        ECREW HANDOVER CABIN REPORT
                    </h1>
                    
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px;">
                        <tr>
                            <td style="padding: 12px; border: 1px solid #ddd; background: #f8fafc; width: 35%;"><strong>Tanggal & Waktu</strong></td>
                            <td style="padding: 12px; border: 1px solid #ddd;">${formatTanggal(r.date)}</td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border: 1px solid #ddd; background: #f8fafc;"><strong>Jenis Pengecekan</strong></td>
                            <td style="padding: 12px; border: 1px solid #ddd;">${r.type || '-'}</td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border: 1px solid #ddd; background: #f8fafc;"><strong>Rute Penerbangan</strong></td>
                            <td style="padding: 12px; border: 1px solid #ddd;">${r.route || '-'}</td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border: 1px solid #ddd; background: #f8fafc;"><strong>Registrasi Pesawat</strong></td>
                            <td style="padding: 12px; border: 1px solid #ddd;">${r.reg || '-'}</td>
                        </tr>
                    </table>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 40px; text-align: center; font-size: 14px;">
                        <tr>
                            <td style="padding: 12px; border: 1px solid #ddd; background: #f8fafc; width: 50%;"><strong>Handover By (Diserahkan Oleh)</strong></td>
                            <td style="padding: 12px; border: 1px solid #ddd; background: #f8fafc; width: 50%;"><strong>Received By (Diterima Oleh)</strong></td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border: 1px solid #ddd; height: 120px; vertical-align: bottom;">
                                ${handoverSignHtml}
                                <strong>${r.handover || '-'}</strong>
                            </td>
                            <td style="padding: 12px; border: 1px solid #ddd; height: 120px; vertical-align: bottom;">
                                ${receivedSignHtml}
                                <strong>${r.received || '-'}</strong>
                            </td>
                        </tr>
                    </table>

                    <h2 style="font-size: 18px; color: #1e293b; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;">
                        Detail Kondisi Kabin & Dokumentasi
                    </h2>
                    <div>
                        ${pdfImagesHtml}
                    </div>
                </div>
            `;

            // Opsi untuk PDF A4
            const opt = {
                margin:       0.75, // Mengatur margin 0.75 inci untuk semua sisi (berlaku di setiap halaman)
                filename:     `Handover_Report_${r.reg || 'Pesawat'}_${r.date.split('T')[0] || 'Date'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            // Proses rendering dari elemen rahasia ke PDF
            html2pdf().set(opt).from(printContainer).save().then(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            }).catch(err => {
                console.error("Gagal mencetak PDF:", err);
                alert("Gagal mencetak dokumen.");
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        function editReport(idx) {
            const r = data.reports[idx];
            document.getElementById('repDate').value = r.date;
            document.getElementById('repType').value = r.type;
            document.getElementById('repRoute').value = r.route;
            document.getElementById('repReg').value = r.reg;
            document.getElementById('handoverBy').value = r.handover;
            document.getElementById('receivedBy').value = r.received;
            
            const imgContainer = document.getElementById('image-reports');
            imgContainer.innerHTML = '<h3 class="text-lg border-b border-white/10 pb-2">Detail Gambar</h3>';
            if(r.images) {
                r.images.forEach(img => {
                    addImageField(img.pos, img.cond, img.fileData);
                });
            }
            
            editIdx.report = idx;
            document.getElementById('submitBtn').innerText = "Update Report";
            showTab('add', document.querySelectorAll('.nav-item')[1]);
            closeModal();
        }

        function duplicateReport(idx) {
            const duplicated = {...data.reports[idx]};
            data.reports.push(duplicated);
            saveToSheet('reports', duplicated);
            renderReports();
            closeModal();
        }

        function addImageField(pos = '', cond = '', fileData = '') {
            const div = document.createElement('div');
            div.className = "image-entry grid grid-cols-1 md:grid-cols-[1fr,1fr,auto,auto] gap-2 p-4 glass rounded-xl items-center mt-2 relative";
            
            let imgPreview = fileData ? `<img src="${fileData}" class="h-10 w-10 object-cover rounded border border-white/20">` : '';
            
            div.innerHTML = `
                <input type="text" placeholder="Position" value="${pos}" class="p-2 rounded w-full">
                <input type="text" placeholder="Condition" value="${cond}" class="p-2 rounded w-full">
                <div class="flex items-center gap-2 w-full">
                    ${imgPreview}
                    <input type="file" accept="image/*" class="p-1 w-full text-sm">
                    <input type="hidden" class="existing-file" value="${fileData}">
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 font-bold px-3 hover:text-red-600">X</button>
            `;
            document.getElementById('image-reports').appendChild(div);
        }

        // --- Logika Database (Cabin, Eng, Air) ---
        function saveData(type) {
            const n = document.getElementById(`${type}Name`)?.value || document.getElementById('airName').value;
            const u = document.getElementById(`${type}Url`)?.value || document.getElementById('airType').value;
            
            if(n) {
                const itemData = {name: n, url: u};
                
                if(editIdx[type] >= 0) { 
                    data[type][editIdx[type]] = itemData; 
                    editIdx[type] = -1; 
                    syncUpdateAll(type);
                } else { 
                    data[type].push(itemData); 
                    saveToSheet(type, itemData);
                }
                
                cancelEdit(type); 
                renderList(type); 
                updateDropdowns();
            }
        }

        function cancelEdit(type) {
            if(type === 'air') { 
                document.getElementById('airName').value = ''; 
                document.getElementById('airType').value = ''; 
            } else { 
                document.getElementById(`${type}Name`).value = ''; 
                document.getElementById(`${type}Url`).value = ''; 
            }
            editIdx[type] = -1;
            renderButtons(type);
        }

        function renderList(type) {
            const list = document.getElementById(`${type}List`);
            list.innerHTML = data[type].map((item, index) => `
                <div class="glass p-4 rounded-xl cursor-pointer hover:bg-white/20 flex justify-between items-center" onclick="openModal('${type}', ${index})">
                    <span>${item.name}</span>
                    <span class="text-xs text-gray-400">Detail ➔</span>
                </div>
            `).join('');
        }

        function renderButtons(type) {
            const btnContainer = document.getElementById(`${type}FormButtons`);
            if(editIdx[type] >= 0) {
                btnContainer.innerHTML = `
                    <button type="button" onclick="saveData('${type}')" class="w-1/2 bg-green-600 hover:bg-green-500 py-3 rounded-xl transition">Update</button>
                    <button type="button" onclick="cancelEdit('${type}')" class="w-1/2 bg-gray-600 hover:bg-gray-500 py-3 rounded-xl transition">Cancel</button>
                `;
            } else {
                btnContainer.innerHTML = `<button type="button" onclick="saveData('${type}')" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl transition">Save</button>`;
            }
        }

        // Fungsi untuk mengonversi URL Google Drive menjadi Direct Image Link
        function getDriveDirectLink(url) {
            if (!url) return '';
            // Mencari ID file dari tautan Google Drive
            const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=)|docs\.google\.com\/.*?id=)([a-zA-Z0-9_-]+)/;
            const match = url.match(driveRegex);
            if (match && match[1]) {
                // MENGGUNAKAN THUMBNAIL API: Lebih stabil dan tidak terblokir oleh aturan keamanan cookie browser baru
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
            }
            return url; 
        }

        function openModal(type, index) {
            const item = data[type][index];
            document.getElementById('modalTitle').innerText = "Detail Data";

            let imgPreview = '';
            // Hanya tampilkan preview gambar untuk Cabin dan Engineer
            if (type === 'cabin' || type === 'eng') {
                const directUrl = getDriveDirectLink(item.url);
                if (directUrl && (directUrl.startsWith('http'))) {
                    imgPreview = `
                        <div class="mt-4">
                            <b class="text-blue-400">Preview Tanda Tangan:</b><br>
                            <div class="mt-2 p-2 bg-white rounded border border-gray-300">
                                <img src="${directUrl}" 
                                     class="max-h-48 w-full object-contain" 
                                     alt="Tanda Tangan" 
                                     onerror="this.onerror=null; this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22150%22%20height%3D%22150%22%20viewBox%3D%220%200%20150%20150%22%3E%3Crect%20fill%3D%22%23ddd%22%20width%3D%22150%22%20height%3D%22150%22%2F%3E%3Ctext%20fill%3D%22%23555%22%20font-family%3D%22sans-serif%22%20font-size%3D%2212%22%20dy%3D%2210.5%22%20font-weight%3D%22bold%22%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%3EGambar%20Tidak%20Ditemukan%3C%2Ftext%3E%3C%2Fsvg%3E';">
                            </div>
                            <p class="text-xs text-yellow-300 mt-2 italic">
                                *Jika gambar tidak muncul, pastikan link Google Drive sudah di-set ke <b>"Anyone with the link" (Siapa saja yang memiliki link)</b>.
                            </p>
                        </div>`;
                }
            }

            document.getElementById('modalContent').innerHTML = `
                <p class="mb-2"><b class="text-blue-400">Data Name:</b> <br> ${item.name}</p>
                <p><b class="text-blue-400">Sign URL / Info:</b> <br> <span class="break-words text-sm text-gray-300">${item.url}</span></p>
                ${imgPreview}
                <div class="mt-8 flex gap-2">
                    <button onclick="editEntry('${type}', ${index})" class="bg-yellow-600 px-6 py-2 rounded-lg font-bold">Edit</button>
                    <button onclick="deleteEntry('${type}', ${index})" class="bg-red-600 px-6 py-2 rounded-lg font-bold">Delete</button>
                </div>
            `;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function editEntry(type, index) {
            const item = data[type][index];
            if(type === 'air') { 
                document.getElementById('airName').value = item.name; 
                document.getElementById('airType').value = item.url; 
            } else { 
                document.getElementById(`${type}Name`).value = item.name; 
                document.getElementById(`${type}Url`).value = item.url; 
            }
            editIdx[type] = index;
            renderButtons(type);
            closeModal();
        }

        function deleteEntry(type, index) { 
            data[type].splice(index, 1); 
            syncUpdateAll(type);
            renderList(type); 
            updateDropdowns(); 
            closeModal(); 
        }

        function closeModal() { 
            document.getElementById('modal').classList.add('hidden'); 
        }
    </script>
</body>
</html>
